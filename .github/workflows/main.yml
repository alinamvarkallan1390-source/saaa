name: Build APK

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Environment diagnostics
        run: |
          {
            echo "==== diagnostics ===="
            echo "ANDROID_HOME=$ANDROID_HOME"
            which gradle || true
            gradle --version || true
            java -version 2>&1 || true
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Build debug APKs
        working-directory: LinkBridge-Android
        run: |
          set -o pipefail
          gradle :phoneApp:assembleDebug :watchApp:assembleDebug --no-daemon --stacktrace 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find LinkBridge-Android -path '*/build/outputs/apk/*' -name '*.apk' -exec cp -v {} artifacts/ \;
          echo "==== collected APKs ===="
          ls -la artifacts

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinkBridge-APKs
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APKs
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" artifacts/*.apk \
            --title "LinkBridge APKs (build #${{ github.run_number }})" \
            --notes "Debug APKs built from commit ${{ github.sha }}." \
            --target "${{ github.sha }}"

      - name: Report build failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT=report.md
          echo "Build run #${{ github.run_number }} failed for commit ${{ github.sha }}." > "$REPORT"
          echo "" >> "$REPORT"
          echo "### Extracted errors" >> "$REPORT"
          echo '```' >> "$REPORT"
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            grep -nE '^e: |error: |FAILURE:|What went wrong|> Task .* FAILED|Unresolved reference|Caused by:|Could not|Execution failed' "$GITHUB_WORKSPACE/build.log" | head -n 250 >> "$REPORT" || true
            echo "" >> "$REPORT"
            echo "----- last 120 lines -----" >> "$REPORT"
            tail -n 120 "$GITHUB_WORKSPACE/build.log" >> "$REPORT"
          else
            echo "No build.log was produced (failure happened before the build step)." >> "$REPORT"
          fi
          echo '```' >> "$REPORT"
          gh issue create --title "CI build failure #${{ github.run_number }}" --body-file "$REPORT"
